name: Release

# Coordinated versioning + npm publish for create-foundry-app, driven by
# changesets. On a push to main:
#   - if there are pending changesets → open/update a "Version Packages" PR
#   - if versions are bumped + an NPM_TOKEN is configured → publish to npm
# This is intentionally NOT part of the CI gate (ci.yml). It degrades
# gracefully: with no NPM_TOKEN it only maintains the Version PR.
#
# The neutral 0gkit toolkit was extracted to its own repo
# (rajkaria/0G-ai-kit) and publishes @foundryprotocol/0gkit-* from there.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: version + publish (changesets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter create-foundry-app build

      - id: npmtoken
        run: echo "has=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Changesets — version PR and/or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: ${{ steps.npmtoken.outputs.has == 'true' && 'pnpm release' || '' }}
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
