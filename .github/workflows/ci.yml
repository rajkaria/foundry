name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm --filter @foundryprotocol/sdk build

      - run: pnpm --filter @foundryprotocol/sdk test

      - run: pnpm boundary:check

      - run: pnpm --filter @0gkit/core build

      - run: pnpm --filter @0gkit/core test

      - run: pnpm --filter @0gkit/chain build

      - run: pnpm --filter @0gkit/chain test

      - run: pnpm --filter @0gkit/da build

      - run: pnpm --filter @0gkit/da test

      - run: pnpm --filter @0gkit/attestation build

      - run: pnpm --filter @0gkit/attestation test

      - run: pnpm --filter @0gkit/storage build

      - run: pnpm --filter @0gkit/storage test

      - run: pnpm --filter @0gkit/compute build

      - run: pnpm --filter @0gkit/compute test

      - run: pnpm --filter @0gkit/da --filter @0gkit/attestation --filter @0gkit/storage --filter @0gkit/compute run coverage

      - run: pnpm typecheck

      - run: pnpm build

  contracts:
    name: contracts · forge build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The contracts/lib/ vendored dependencies are not committed.
      # Install them fresh on every CI run.
      - name: forge install deps
        run: |
          git config --global user.email "ci@foundry.test"
          git config --global user.name "ci"
          forge install \
            foundry-rs/forge-std \
            OpenZeppelin/openzeppelin-contracts \
            Vectorized/solady

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vvv

      - name: forge coverage
        run: forge coverage --report summary
        continue-on-error: true

  deploy-dry-run:
    name: contracts · deploy script dry-run
    runs-on: ubuntu-latest
    needs: contracts
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: forge install deps
        run: |
          git config --global user.email "ci@foundry.test"
          git config --global user.name "ci"
          forge install \
            foundry-rs/forge-std \
            OpenZeppelin/openzeppelin-contracts \
            Vectorized/solady

      # Spin up Anvil in the background and dry-run the deploy script.
      # This verifies the deploy actually executes end-to-end against a
      # live JSON-RPC, catching any vm.envXxx + writeFile regressions
      # before they hit mainnet.
      - name: anvil + deploy-dry-run
        run: |
          anvil --port 8545 --silent &
          ANVIL_PID=$!
          sleep 2
          export DEPLOYER_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
          export TREASURY_ADDR=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          export FOUNDRY_NET=local
          forge script script/Deploy.s.sol \
            --rpc-url http://127.0.0.1:8545 \
            --broadcast
          test -f deployments/local.json
          kill $ANVIL_PID || true

  eval:
    name: eval · lint · type · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: uv sync
        run: uv sync --extra dev

      - name: ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q

  mainnet-smoke:
    name: mainnet · read-only smoke (post-deploy)
    runs-on: ubuntu-latest
    needs: web
    # Reads chain state — never writes. Skips silently when the deploy
    # secrets aren't configured (pre-deploy).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @foundryprotocol/sdk build

      - name: mainnet smoke
        env:
          RPC_ARISTOTLE: ${{ secrets.RPC_ARISTOTLE }}
        run: |
          if [ -z "$RPC_ARISTOTLE" ]; then
            echo "RPC_ARISTOTLE secret not set — pre-deploy, skipping."
            exit 0
          fi
          node scripts/mainnet-smoke.mjs
