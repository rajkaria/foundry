name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

  contracts:
    name: contracts · forge build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # The contracts/lib/ vendored dependencies are not committed.
      # Install them fresh on every CI run.
      - name: forge install deps
        run: |
          git config --global user.email "ci@foundry.test"
          git config --global user.name "ci"
          forge install \
            foundry-rs/forge-std \
            OpenZeppelin/openzeppelin-contracts \
            Vectorized/solady

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vvv

      - name: forge coverage
        run: forge coverage --report summary
        continue-on-error: true

  eval:
    name: eval · lint · type · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: uv sync
        run: uv sync --frozen
        continue-on-error: true

      - name: ruff
        run: uv run ruff check .
        continue-on-error: true

      - name: mypy
        run: uv run mypy src
        continue-on-error: true

      - name: pytest
        run: uv run pytest -q
        continue-on-error: true
